packages:
  - payunlock-frontend
  - payunlock-backend
  - payunlock-contract
  - payunlock-indexer
  - packages/*

saveExact: true
strictPeerDependencies: true
autoInstallPeers: true
overrides:
  # Align Envio's terminal React renderer with the workspace's React peer.
  'envio>react': 19.3.0
allowBuilds:
  '@reown/appkit': false
  esbuild: true
  keccak: true
  protobufjs: false
  secp256k1: true
