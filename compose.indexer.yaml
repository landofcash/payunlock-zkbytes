name: payunlock-indexer
services:
  indexer-db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: envio
      POSTGRES_DB: envio
      POSTGRES_PASSWORD: ${ENVIO_PG_PASSWORD:?Run pnpm indexer:setup}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - indexer-data-v5:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U envio -d envio"]
      interval: 3s
      timeout: 3s
      retries: 20
  hasura:
    image: hasura/graphql-engine:v2.48.0
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://envio:${ENVIO_PG_PASSWORD}@indexer-db:5432/envio
      HASURA_GRAPHQL_ADMIN_SECRET: ${ENVIO_HASURA_ADMIN_SECRET:?Run pnpm indexer:setup}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
      HASURA_GRAPHQL_STRINGIFY_NUMERIC_TYPES: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup,http-log
    depends_on:
      indexer-db:
        condition: service_healthy
  indexer:
    build:
      context: .
      dockerfile: payunlock-indexer/Dockerfile
    environment:
      ENVIO_API_TOKEN: ${ENVIO_API_TOKEN:-}
      ENVIO_PG_HOST: indexer-db
      ENVIO_PG_PORT: 5432
      ENVIO_PG_USER: envio
      ENVIO_PG_DATABASE: envio
      ENVIO_PG_PASSWORD: ${ENVIO_PG_PASSWORD}
      ENVIO_PG_SCHEMA: public
      HASURA_GRAPHQL_ENDPOINT: http://hasura:8080/v1/metadata
      HASURA_GRAPHQL_ADMIN_SECRET: ${ENVIO_HASURA_ADMIN_SECRET}
      HASURA_GRAPHQL_ROLE: admin
      ENVIO_TUI: "false"
      ENVIO_INDEXER_PORT: 9898
    ports:
      - "127.0.0.1:9899:9898"
    volumes:
      - ./payunlock-indexer:/workspace/payunlock-indexer
      - indexer-modules:/workspace/payunlock-indexer/node_modules
      - ./payunlock-contract/abi:/workspace/payunlock-contract/abi:ro
      - ./tsconfig.base.json:/workspace/tsconfig.base.json:ro
    depends_on:
      indexer-db:
        condition: service_healthy
      hasura:
        condition: service_healthy
volumes:
  indexer-data-v5:
  indexer-modules:
